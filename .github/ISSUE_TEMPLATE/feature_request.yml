name: Feature request
description: Something Contributron should be able to do
labels: ["slice"]
body:
  - type: markdown
    attributes:
      value: >-
        Check `docs/roadmap.md` and the open issues first. A fair amount is already
        deliberately deferred rather than overlooked, and those issues carry the reason:
        if you disagree with one, arguing against the recorded reason is more useful than
        a fresh request.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >-
        The situation you are in, not the feature you imagine. A described problem can be
        solved in a way nobody thought of; a described solution usually cannot.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How would you know it worked?
      description: >-
        If you can, state it as Given / When / Then. Every feature here ships with
        acceptance criteria in that form, written before the code, so this is the part that
        most shapes whether it gets built.
      placeholder: |
        Given a pull request with two unresolved threads
        When the rule runs
        Then ...
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Does this involve an agent changing something?
      description: >-
        Anything that mutates a repository, replies on your behalf, or merges needs an
        operator in the loop by default. Saying so up front avoids a design that has to be
        unpicked later.
      options:
        - "No: read-only, it only observes or reports"
        - "Yes: it would change a branch, a comment or a merge state"
        - Not sure
    validations:
      required: true

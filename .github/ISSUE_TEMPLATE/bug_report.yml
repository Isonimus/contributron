name: Bug report
description: Something Contributron does wrong
labels: ["defect"]
body:
  - type: markdown
    attributes:
      value: >-
        If the problem is that an agent did something it should not have been permitted to
        do, that is a security issue rather than a defect: report it privately through the
        Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed, or the commit you built from (`git rev-parse --short HEAD`).
      placeholder: "0.1.0, or 5f5c1aa"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Provider adapter (reading from GitHub)
        - Event store or deduplication
        - Polling and reconciliation
        - Workflow engine or state
        - Policy engine or capabilities
        - Agent execution or worktrees
        - Approvals
        - CLI output
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant output around the problem. Redact tokens before pasting: the daemon holds
        provider credentials and an agent's logs can contain repository content.
      render: text
  - type: textarea
    id: workflow
    attributes:
      label: The rule or workflow involved
      description: If a rule was running, what it was supposed to do.
      render: text
